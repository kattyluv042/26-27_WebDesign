<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lists</title>
</head>
<body>
<!--  Unordered list - bullets or dashes -->
<ul>
    <li>My first item</li>


</ul>

<!-- Ordered List - numbered-->
<ol>
    <li>My first item</li>

</ol>

<!-- Descriptive Lists - Make your own heading!-->
<dl>
    <dt>Coffee</dt>
    <dd>Black hot drink</dd>
    <dt>Milk</dt>
    <dd>White cold drink</dd>
</dl>

</body>
</html>
